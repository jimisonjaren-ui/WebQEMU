name: Build WebQEMU x86_64 WASM

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-qemu-wasm.sh'
      - 'debian/**'
      - '.github/workflows/build-qemu-wasm.yml'

permissions:
  contents: write

env:
  DOCKER_BUILDKIT: '1'

jobs:
  build-x86_64:
    name: Compile QEMU for x86_64 guests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out WebQEMU
        uses: actions/checkout@v4

      - name: Install Git
        run: sudo apt-get update && sudo apt-get install -y git

      - name: Build QEMU-WASM
        run: bash scripts/build-qemu-wasm.sh

      - name: Upload compiled WebAssembly runtime
        uses: actions/upload-artifact@v4
        with:
          name: webqemu-x86_64-wasm
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Publish desktop disk to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts
          # The build may leave the disk in 90 MB parts; join them if so.
          if ls debian-desktop.bin.gz.part-* >/dev/null 2>&1; then
            cat debian-desktop.bin.gz.part-* > debian-desktop.bin.gz
          fi
          test -s debian-desktop.bin.gz
          test -s debian-desktop.size
          sha256sum debian-desktop.bin.gz > debian-desktop.bin.gz.sha256
          ls -l debian-desktop.bin.gz debian-desktop.bin.gz.sha256 debian-desktop.size
          if ! gh release view desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create desktop-latest --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Desktop disk (rolling)" \
              --notes "Xfce + Firefox root disk for WebQEMU. Replaced by each build."
          fi
          gh release upload desktop-latest --repo "$GITHUB_REPOSITORY" --clobber \
            debian-desktop.bin.gz debian-desktop.bin.gz.sha256 debian-desktop.size
